# Sert l'application (SPA) construite par Vite
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Fichiers versionnés par Vite (nom avec hash) : cache navigateur d'un an
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Point d'entrée et service worker : jamais en cache, pour livrer les mises à jour immédiatement
    location ~ ^/(index\.html|sw\.js|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
