# Routes communes aux trois frontends (incluses dans chaque bloc server de nginx.conf).
# Les en-têtes sont définis ici une seule fois : aucune location ne doit en redéfinir
# (sinon nginx n'hérite plus de ceux-ci).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

location ~ ^/api/(auth/|saas/inscription/|saas/paiements/simulateur/) {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://backend;
}
location /api/ {
    proxy_pass http://backend;
}
location /admin/login/ {
    limit_req zone=auth burst=10 nodelay;   # connexion des comptes plateforme
    proxy_pass http://backend;
}
location /admin/ {
    proxy_pass http://backend;
}
location /ws/ {
    proxy_pass http://backend;
    proxy_read_timeout 1h;
}
location /static/ {
    alias /usr/share/nginx/html/static/;
    expires 7d;
}
location /media/ {
    alias /usr/share/nginx/html/media/;
    expires 7d;
}
