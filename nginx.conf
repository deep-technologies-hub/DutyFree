worker_processes auto;
events { worker_connections 2048; }

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    # Compression des réponses JSON de l'API (gros gains sur les listes)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # Anti force brute : connexion, mot de passe oublié, inscription, paiement
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    limit_req_status 429;

    upstream backend { server backend:8000; keepalive 32; }
    upstream app-backoffice { server app-backoffice:80; }
    upstream app-caisse { server app-caisse:80; }
    upstream app-stock { server app-stock:80; }

    # WebSocket : « upgrade » ; requêtes HTTP : en-tête vide → connexions keepalive réutilisées
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Si un proxy TLS est placé devant, il transmet X-Forwarded-Proto ; sinon on prend le schéma local.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), usb=(self)" always;

    # Trois serveurs : seul le frontend servi sur / change, les routes backend sont communes.
    server {
        listen 80;
        location / { proxy_pass http://app-backoffice; }
        include /etc/nginx/dutyfree_backend.conf;
    }
    server {
        listen 81;
        location / { proxy_pass http://app-caisse; }
        include /etc/nginx/dutyfree_backend.conf;
    }
    server {
        listen 82;
        location / { proxy_pass http://app-stock; }
        include /etc/nginx/dutyfree_backend.conf;
    }
}
