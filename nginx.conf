worker_processes auto;
events { worker_connections 2048; }

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    # Compression des réponses JSON de l'API (gros gains sur les listes)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # Derrière le proxy HTTPS (Caddy, réseau Docker privé) : IP réelle du client,
    # sinon tous les clients partageraient la même limite de débit.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Anti force brute : connexion, mot de passe oublié, inscription, paiement
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    limit_req_status 429;

    # DNS Docker relu en continu : après une reconstruction, les conteneurs changent d'IP.
    # Sans « resolve », nginx garderait les anciennes adresses (applications inversées, 502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream backend        { zone backend 64k;        server backend:8000 resolve; keepalive 32; }
    upstream app-backoffice { zone app-backoffice 64k; server app-backoffice:80 resolve; }
    upstream app-caisse     { zone app-caisse 64k;     server app-caisse:80 resolve; }
    upstream app-stock      { zone app-stock 64k;      server app-stock:80 resolve; }

    # WebSocket : « upgrade » ; requêtes HTTP : en-tête vide → connexions keepalive réutilisées
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Si un proxy TLS est placé devant, il transmet X-Forwarded-Proto ; sinon on prend le schéma local.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), usb=(self)" always;

    # Trois serveurs : seul le frontend servi sur / change, les routes backend sont communes.
    server {
        listen 80;
        location / { proxy_pass http://app-backoffice; }
        include /etc/nginx/dutyfree_backend.conf;
    }
    server {
        listen 81;
        location / { proxy_pass http://app-caisse; }
        include /etc/nginx/dutyfree_backend.conf;
    }
    server {
        listen 82;
        location / { proxy_pass http://app-stock; }
        include /etc/nginx/dutyfree_backend.conf;
    }
}
